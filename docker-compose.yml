services:
  pyrecrawl:
    build:
      context: .
      dockerfile: Dockerfile.pyrecrawl
    container_name: pyrecrawl
    ports:
      - "8000:8000"
    environment:
      - PYRECRAWL_NO_TELEMETRY=1
    restart: unless-stopped
    volumes:
      - pyrecrawl_cache:/root/.cache/pyrecrawl

volumes:
  pyrecrawl_cache:
